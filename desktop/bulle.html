<!doctype html>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src file: data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Bulle KORA</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; }
  img { width: 100%; height: 100%; object-fit: contain; display: block; cursor: grab; touch-action: none;
        filter: drop-shadow(0 4px 6px rgba(0, 0, 0, .35)); -webkit-user-drag: none; }
  img.prise { cursor: grabbing; }
  img:hover { transform: scale(1.04); }
</style>
<img id="b" src="assets/bulle.png" alt="Bulle KORA : touche-moi pour vérifier l'écran" draggable="false">
<script>
  // un appui court = vérifier l'écran ; un glissement = déplacer la bulle ; clic droit = menu
  const b = document.getElementById("b")
  let depart = null, bouge = false
  b.addEventListener("pointerdown", (e) => {
    if (e.button !== 0) return
    depart = { x: e.screenX, y: e.screenY }; bouge = false
    b.setPointerCapture(e.pointerId); b.classList.add("prise"); window.bulle.debut()
  })
  b.addEventListener("pointermove", (e) => {
    if (!depart) return
    const dx = e.screenX - depart.x, dy = e.screenY - depart.y
    if (!bouge && Math.hypot(dx, dy) < 5) return
    bouge = true
    window.bulle.deplacer(dx, dy)
  })
  b.addEventListener("pointerup", (e) => {
    if (!depart) return
    depart = null; b.classList.remove("prise")
    if (bouge) window.bulle.lacher(); else window.bulle.toucher()
  })
  b.addEventListener("pointercancel", () => { depart = null; b.classList.remove("prise") })
  b.addEventListener("contextmenu", (e) => { e.preventDefault(); window.bulle.menu() })
</script>
