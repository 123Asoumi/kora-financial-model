# À chaque pull request et sur main : les tests, puis l'APK Android de test (signée avec la clé de débogage),
# téléchargeable dans l'onglet « Actions » de GitHub (rubrique Artifacts).
name: Tests et APK de test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pip install scikit-learn pandas numpy pytest
      - run: python -m pytest tests/ -v

  apk:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: SDK Android 36
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null
      - run: npm ci
      - run: npx cap sync android
      - run: ./gradlew assembleDebug --no-daemon
        working-directory: android
      - name: Nom du fichier
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mv android/app/build/outputs/apk/debug/app-debug.apk "KORA-lite-$VERSION-test.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: KORA-lite-apk-de-test
          path: KORA-lite-*-test.apk
