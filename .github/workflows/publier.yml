# Publie une version de KORA-lite : APK Android signée avec la clé de KORA, attachée à une version GitHub
# (onglet « Releases »). Se lance tout seul à chaque envoi sur main : si le numéro de package.json n'a pas
# encore été publié, la version est créée ; sinon, rien n'est fait. On peut aussi le lancer à la main.
# Les téléphones qui ont l'appli (1.0.5 et suivantes) voient alors la mise à jour et la proposent.
# Secrets nécessaires (Settings → Secrets and variables → Actions) : voir ANDROID.md.
name: Publier une version

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publier
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  verifier:
    runs-on: ubuntu-latest
    outputs:
      nouvelle: ${{ steps.v.outputs.nouvelle }}
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "nouvelle=0" >> "$GITHUB_OUTPUT"
            echo "::notice::La version v$VERSION est déjà publiée : rien à faire. Pour publier, change le numéro dans package.json (voir CHANGELOG.md)."
          else
            echo "nouvelle=1" >> "$GITHUB_OUTPUT"
          fi

  publier:
    needs: verifier
    if: needs.verifier.outputs.nouvelle == '1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests
        run: |
          pip install scikit-learn pandas numpy pytest
          python -m pytest tests/ -q
      - name: Version
        run: echo "VERSION=${{ needs.verifier.outputs.version }}" >> "$GITHUB_ENV"
      - name: Clé de signature
        env:
          KORA_KEYSTORE_BASE64: ${{ secrets.KORA_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KORA_KEYSTORE_BASE64" ]; then
            echo "::error::Le secret KORA_KEYSTORE_BASE64 manque (voir ANDROID.md)."
            exit 1
          fi
          echo "$KORA_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/kora.jks"
          echo "KORA_KEYSTORE=$RUNNER_TEMP/kora.jks" >> "$GITHUB_ENV"
      - name: SDK Android 36
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null
      - run: npm ci
      - run: npx cap sync android
      - name: APK signée
        working-directory: android
        env:
          KORA_KEYSTORE_MOT_DE_PASSE: ${{ secrets.KORA_KEYSTORE_MOT_DE_PASSE }}
          KORA_CLE_ALIAS: ${{ secrets.KORA_CLE_ALIAS }}
          KORA_CLE_MOT_DE_PASSE: ${{ secrets.KORA_CLE_MOT_DE_PASSE }}
        run: ./gradlew assembleRelease --no-daemon
      - name: Vérifier la signature
        run: |
          APK="KORA-lite-$VERSION.apk"
          mv android/app/build/outputs/apk/release/app-release.apk "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK" | tee certificat.txt
          EMPREINTE=$(grep -m1 "certificate SHA-256 digest" certificat.txt | awk '{print $NF}')
          # une seule clé pour toutes les versions : on compare avec l'empreinte enregistrée dans le dépôt
          # (acceptée telle qu'affichée par apksigner « ab12… » ou par keytool « AB:12:… »)
          ATTENDUE=$(grep -v '^#' android/empreinte-cle.txt | tr -d '[:space:]:' | tr 'A-F' 'a-f')
          if [ -z "$ATTENDUE" ]; then
            echo "::warning::Première signature : copie cette empreinte dans android/empreinte-cle.txt pour verrouiller la clé : $EMPREINTE"
          elif [ "$ATTENDUE" != "$EMPREINTE" ]; then
            echo "::error::Cette APK n'est pas signée avec la clé officielle de KORA-lite ($EMPREINTE au lieu de $ATTENDUE). Les téléphones refuseraient la mise à jour."
            exit 1
          fi
          echo "EMPREINTE=$EMPREINTE" >> "$GITHUB_ENV"
          sha256sum "$APK" > "$APK.sha256"
          echo "SHA_APK=$(sha256sum "$APK" | awk '{print $1}')" >> "$GITHUB_ENV"
      - name: Version GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # les notes de version : la section du CHANGELOG pour cette version
          awk -v v="## [$VERSION]" 'index($0, v) == 1 {on=1; next} on && /^## \[/ {exit} on' CHANGELOG.md > notes.md
          printf '\n---\nAPK signée avec la clé officielle de KORA-lite. Empreinte SHA-256 du certificat : `%s`\nSHA-256 de l'"'"'APK : `%s`\n' "$EMPREINTE" "$SHA_APK" >> notes.md
          gh release create "v$VERSION" "KORA-lite-$VERSION.apk" "KORA-lite-$VERSION.apk.sha256" \
            --target "$GITHUB_SHA" --title "KORA-lite $VERSION" --notes-file notes.md
      - name: Effacer la clé
        if: always()
        run: rm -f "$RUNNER_TEMP/kora.jks"
