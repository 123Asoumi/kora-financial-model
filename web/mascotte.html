<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #060607; }
  body { font-family: Rubik, system-ui, sans-serif; color: #f4efe6; transition: color .3s; }
  body[data-theme="light"] { color: #1b2327; background: #ebe6dc; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: pointer; }
  .brand { position: fixed; top: 22px; left: 26px; font-weight: 800; font-size: 28px; letter-spacing: .5px; pointer-events: none; }
  .brand span { color: #c99245; }
  .ui { position: fixed; top: 20px; right: 20px; display: flex; gap: 8px; }
  .ui button {
    font: 500 13px Rubik, system-ui, sans-serif; color: inherit; cursor: pointer;
    background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.18);
    border-radius: 999px; padding: 8px 14px; backdrop-filter: blur(8px);
  }
  body[data-theme="light"] .ui button { background: rgba(0,0,0,.05); border-color: rgba(0,0,0,.15); }
  .ui button:hover { border-color: #c99245; }
  .emos { position: fixed; bottom: 46px; left: 0; right: 0; display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; padding: 0 12px; }
  .emos button {
    font: 500 13px Rubik, system-ui, sans-serif; color: inherit; cursor: pointer;
    background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.14);
    border-radius: 999px; padding: 7px 13px; transition: all .2s;
  }
  body[data-theme="light"] .emos button { background: rgba(0,0,0,.04); border-color: rgba(0,0,0,.12); }
  .emos button:hover { border-color: #c99245; }
  .emos button.on { background: #c99245; border-color: #c99245; color: #1b2327; }
  .now { position: fixed; top: 60px; left: 26px; font-size: 14px; opacity: .7; pointer-events: none; }
  .camBox { position: fixed; top: 100px; left: 26px; display: none; align-items: center; gap: 12px; pointer-events: none; }
  .camBox.on { display: flex; }
  .camBox video { width: 96px; height: 96px; object-fit: cover; border-radius: 50%; border: 2px solid #c99245; transform: scaleX(-1); background: #000; }
  .camBox.err video { display: none; }
  .camMsg { pointer-events: auto; font-size: 13px; max-width: 240px; line-height: 1.35; opacity: .85; }
  body.embed .ui, body.embed .emos, body.embed .hint, body.embed .now, body.embed .brand, body.embed .camBox { display: none !important; }
  .bulle { position: fixed; top: 14px; left: 50%; transform: translateX(-50%); display: none; max-width: 80%;
    background: #fff; color: #1b2327; font-weight: 800; font-size: 18px; padding: 10px 18px; border-radius: 18px;
    border: 3px solid #1b2327; box-shadow: 0 4px 0 #1b2327; text-align: center; pointer-events: none; }
  .bulle.on { display: block; }
  body.embed .bulle { font-size: 14px; padding: 6px 12px; top: 10px; border-width: 2px; box-shadow: 0 3px 0 #1b2327; }
  .camMsg a { color: #c99245; font-weight: 700; }
  .hint { position: fixed; bottom: 20px; left: 0; right: 0; text-align: center; font-size: 13px; opacity: .6; pointer-events: none; }
  @media (max-width: 560px) { .brand { font-size: 22px; } .emos { bottom: 64px; } .emos button { padding: 6px 10px; font-size: 12px; } .hint { font-size: 11px; bottom: 10px; padding: 0 14px; } }
